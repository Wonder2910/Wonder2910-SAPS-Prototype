<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPS Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="asset/PoliceBadge.gif">
    <style>
        :root {
            --police-blue: #0047ab;
            --police-gold: #ffd700;
            --error-red: #dc3545;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border-top: 4px solid var(--police-blue);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 80px;
            margin-bottom: 1rem;
        }

        .login-header h2 {
            color: var(--police-blue);
            font-weight: 700;
        }

        .form-control:focus {
            border-color: var(--police-blue);
            box-shadow: 0 0 0 0.25rem rgba(0, 71, 171, 0.25);
        }

        .btn-login {
            background: var(--police-blue);
            color: white;
            font-weight: 600;
            width: 100%;
            padding: 0.8rem;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #003366;
            transform: translateY(-2px);
        }

        .error-message {
            color: var(--error-red);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="asset/PoliceBadge.gif" alt="SAPS Badge">
                <h2>SAPS Admin Portal</h2>
                <p class="text-muted">Authorized personnel only</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Badge Number</label>
                    <input type="text" class="form-control" id="username" required
                        placeholder="e.g., ADMINuserName 123">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                    <div id="loginError" class="error-message">Invalid credentials. Please try again.</div>
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span id="loginBtnText">Login</span>
                        <span id="loginSpinner" style="display: none;">
                            <span class="loading-spinner"></span>
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');
            const loginError = document.getElementById('loginError');

            // Show loading state
            loginBtnText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';
            loginError.style.display = 'none';

            // Create JSONP request for login
            const callbackName = 'handleLoginResponse_' + Date.now();
            let scriptElement = document.createElement('script');
            window[callbackName] = function (response) {
                // Clean up
                delete window[callbackName];
                if (scriptElement.parentNode) {
                    scriptElement.parentNode.removeChild(scriptElement);
                }

                // Hide loading state
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';

                if (response.success && response.valid) {
                    // Store authentication token and username
                    localStorage.setItem('adminToken', response.token);
                    localStorage.setItem('adminUsername', username);

                    // Redirect to dashboard
                    window.location.href = 'Translate.html';
                } else {
                    // Show error message
                    loginError.textContent = response.message || 'Invalid credentials. Please try again.';
                    loginError.style.display = 'block';
                    document.getElementById('password').value = '';
                    console.log('Login failed: ' + response.message);
                }
            };

            // Add error handling for script load failure
            scriptElement.onerror = function () {
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';
                loginError.textContent = 'Failed to connect to the server. Please try again.';
                loginError.style.display = 'block';
                console.error('Failed to load script');
            };

            scriptElement.src = `https://script.google.com/macros/s/AKfycbwtENbrjJtXHMA3O-O5fDoTiy2Iuv4d0jwVH1a3PslWZ3O3b1W-0Ze-IJC_pQjZy_i0/exec?callback=${callbackName}&action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
            document.body.appendChild(scriptElement);
        });
    </script>
</body>

</html>
