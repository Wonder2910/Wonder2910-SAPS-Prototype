<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Case Management System</title>
    <link rel="icon" href="asset/PoliceBadge.gif" id="favicon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        :root {
            --police-blue: #003087;
            --police-light-blue: #0051BA;
            --police-gold: #FFD700;
            --police-white: #F5F6F5;
            --police-dark: #212529;
        }
        body {
            background: linear-gradient(135deg, var(--police-blue) 0%, var(--police-light-blue) 100%);
            color: var(--police-dark);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .navbar {
            background-color: var(--police-dark) !important;
            border-bottom: 3px solid var(--police-gold);
        }
        .navbar-brand img {
            height: 40px;
        }
        .nav-link {
            color: var(--police-white) !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: var(--police-gold) !important;
        }
        .container {
            background-color: var(--police-white);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .upload-container {
            border: 2px dashed var(--police-blue);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            background-color: rgba(0, 48, 135, 0.05);
            transition: background-color 0.3s ease;
        }
        .upload-container:hover {
            background-color: rgba(0, 48, 135, 0.1);
        }
        .upload-container label {
            color: var(--police-blue);
            font-weight: 600;
            cursor: pointer;
        }
        .upload-container label:hover {
            color: var(--police-light-blue);
            text-decoration: underline;
        }
        .btn-primary {
            background-color: var(--police-blue);
            border-color: var(--police-blue);
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--police-light-blue);
            border-color: var(--police-light-blue);
        }
        .btn-send,
        .btn-clear,
        .btn-performance {
            background-color: var(--police-gold);
            color: var(--police-dark);
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin-left: 10px;
        }
        .btn-send:hover,
        .btn-clear:hover,
        .btn-performance:hover {
            background-color: #FFC107;
        }
        .table-container {
            margin-top: 20px;
        }
        .table thead th {
            background-color: var(--police-blue);
            color: var(--police-white);
            border: none;
        }
        .table tbody tr {
            transition: background-color 0.3s ease;
        }
        .table tbody tr:hover {
            background-color: rgba(0, 48, 135, 0.05);
        }
        .badge-count {
            font-size: 0.9rem;
            padding: 5px 10px;
            background-color: var(--police-blue);
            color: var(--police-white);
        }
        .btn-view {
            background-color: var(--police-gold);
            color: var(--police-dark);
            border: none;
            padding: 5px 15px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .btn-view:hover {
            background-color: #FFC107;
            color: var(--police-dark);
        }
        .total-cases {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--police-blue);
            margin-top: 20px;
            text-align: right;
        }
        #sendToSheet {
            display: none;
            margin-top: 20px;
            text-align: right;
        }
        #hiddenForm {
            display: none;
        }
        #callbackFrame {
            display: none;
        }
        #loadingModal .modal-content {
            background-color: var(--police-white);
            color: var(--police-dark);
        }
        #loadingModal .modal-header {
            background-color: var(--police-blue);
            color: var(--police-white);
            border-bottom: none;
        }
        #loadingModal .modal-body {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .footer {
            background-color: var(--police-dark);
            color: var(--police-white);
            text-align: center;
            padding: 10px 0;
            position: auto;
            width: 100%;
            bottom: 0;
        }
    </style>
    <style>
        .footer {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem 0;
        }
        .footer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .footer-logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
            transition: all 0.3s ease;
        }
        .footer-logo-img:hover {
            filter: brightness(1.2);
        }
        .footer-text {
            text-align: center;
            flex-grow: 1;
            margin: 0 20px;
        }
        .footer-text p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Inter', sans-serif;
        }
        @media (max-width: 768px) {
            .footer-bottom {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .footer-text {
                margin: 15px 0;
                order: 3;
            }
            .footer-logo-left {
                order: 1;
            }
            .footer-logo-right {
                order: 2;
            }
            .footer-logo-img {
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="asset/PoliceBadge.gif" alt="SAPS Logo">
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="Translate.html">Home</a>
                <a class="nav-link" href="Performance.html">Performance</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2 class="text-center mb-4">Police Case Management System</h2>
        <div class="upload-container">
            <form id="uploadForm">
                <div class="mb-3">
                    <label for="csvFile">Upload Officer Data (Excel File)</label>
                    <input type="file" class="form-control d-none" id="csvFile" accept=".xlsx, .xls" required>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
        </div>
        <div class="table-container">
            <table id="officerTable" class="table table-striped table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Badge Number</th>
                        <th>Cases</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="total-cases">
            Total Cases: <span id="totalCases">0</span>
        </div>
        <div id="sendToSheet">
            <button class="btn btn-send">Send to Google Sheet</button>
            <button class="btn btn-clear">Clear Data</button>
            <a href="Performance.html" class="btn btn-performance">View Performance</a>
        </div>
        <!-- Hidden form for submitting data to Google Apps Script -->
        <form id="hiddenForm" method="POST" target="callbackFrame"
            action="https://script.google.com/macros/s/AKfycbyihAEef8QX7SAV0E5HnCADq_mvh7IEleY9f_SYxZvqTEvJLgUb9HLIuUMuwsFlis4/exec">
            <input type="hidden" name="action" value="upload">
            <input type="hidden" name="officers" id="hiddenOfficers">
            <input type="hidden" name="casesBySheet" id="hiddenCasesBySheet">
        </form>
        <!-- Hidden iframe for callback -->
        <iframe id="callbackFrame" name="callbackFrame"></iframe>
    </div>
    <!-- Loading/Success Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loadingModalLabel">Processing</h5>
                </div>
                <div class="modal-body" id="loadingModalBody">
                    Loading...
                </div>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer class="footer" style="background-color: #000000;">
        <div class="footer-bottom">
            <div class="footer-logo-left">
                <img src="asset/GritLabAfrica.png" alt="Left Logo" class="footer-logo-img">
            </div>
            <div class="footer-text">
                <p>© 2025 HearMe. All rights reserved.</p>
                <!-- <p id="apiCredit">Powered by Web Speech API & Translation API</p>-->
            </div>
            <div class="footer-logo-right">
                <!-- <img src="asset/JBS.png" alt="Right Logo" class="footer-logo-img"> -->
            </div>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
    $(document).ready(function () {
        const defaultFilePath = 'police_data (2).xlsx';   // <-- your file path

        let casesBySheet = {};
        const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'), {
            backdrop: 'static',
            keyboard: false
        });

        /* --------------------------------------------------------------
           1. Auto-load the default file (if no data in localStorage)
           -------------------------------------------------------------- */
        if (!JSON.parse(localStorage.getItem('storedOfficers') || '[]').length && defaultFilePath) {
            loadDefaultFile();
        } else {
            // data already present → just fill the table
            casesBySheet = JSON.parse(localStorage.getItem('casesBySheet')) || {};
            populateDataTable(JSON.parse(localStorage.getItem('storedOfficers')) || []);
        }

        /* --------------------------------------------------------------
           2. Load default Excel file (fetch → process → hide modal)
           -------------------------------------------------------------- */
        function loadDefaultFile() {
            $('#loadingModalBody').text('Loading default data...');
            loadingModal.show();                     // <-- show modal

            fetch(defaultFilePath)
                .then(r => {
                    if (!r.ok) throw new Error(r.statusText);
                    return r.arrayBuffer();
                })
                .then(buf => {
                    processExcelData(buf);
                    setTimeout(() => loadingModal.hide(), 2000); // <-- hide after 2 s
                })
                .catch(err => {
                    console.error(err);
                    alert('Could not load default file: ' + err.message);
                    loadingModal.hide();           // <-- make sure it disappears on error
                    populateDataTable([]);
                });
        }

        /* --------------------------------------------------------------
           3. Process any Excel buffer (upload or auto-load)
           -------------------------------------------------------------- */
        function processExcelData(arrayBuffer) {
            const workbook   = XLSX.read(arrayBuffer, { type: 'array' });
            const sheetNames = workbook.SheetNames;

            if (sheetNames.length < 2) {
                alert('Excel file must have at least two sheets.');
                return;
            }

            // ---- officers (first sheet) ----
            const officerSheet = workbook.Sheets[sheetNames[0]];
            const officers = XLSX.utils.sheet_to_json(officerSheet, {
                header: ['Name','Position','BadgeNumber','Cases']
            }).slice(1);

            // ---- cases (all other sheets) ----
            casesBySheet = {};
            sheetNames.slice(1).forEach((name, i) => {
                const caseSheet = workbook.Sheets[name];
                const cases = XLSX.utils.sheet_to_json(caseSheet, {
                    header: ['Case-ID','Type','Status','Date-Reported','Last-Updated']
                }).slice(1);
                casesBySheet[`Sheet${i+2}`] = cases;
            });

            populateDataTable(officers);
        }

        /* --------------------------------------------------------------
           4. Fill the DataTable (same as before)
           -------------------------------------------------------------- */
        function populateDataTable(officers) {
            const stored = officers.map(o => ({
                Name: o.Name,
                Position: o.Position,
                BadgeNumber: o.BadgeNumber,
                Cases: o.Cases
            }));
            localStorage.setItem('storedOfficers', JSON.stringify(stored));
            localStorage.setItem('casesBySheet', JSON.stringify(casesBySheet));

            const table = $('#officerTable').DataTable({
                destroy: true,
                data: officers,
                columns: [
                    { data: 'Name' },
                    { data: 'Position' },
                    { data: 'BadgeNumber' },
                    { data: 'Cases', render: d => `<span class="badge bg-primary badge-count">${d}</span>` },
                    { data: null, render: (d,t,r,m) => `<button class="btn btn-view" data-badge="${r.BadgeNumber}" data-index="${m.row}">View Cases</button>` }
                ],
                ordering: false
            });

            $('#officerTable tbody').off('click').on('click', '.btn-view', function () {
                const badge = $(this).data('badge');
                const idx   = $(this).data('index');
                localStorage.setItem('selectedBadge', badge);
                localStorage.setItem('selectedIndex', idx);
                location.href = 'Dashboard.html';
            });

            const total = officers.reduce((s,o)=>s+(parseInt(o.Cases)||0),0);
            $('#totalCases').text(total);
            $('#sendToSheet').show();
        }

        /* --------------------------------------------------------------
           5. Manual upload (kept unchanged)
           -------------------------------------------------------------- */
        $('#uploadForm').on('submit', function (e) {
            e.preventDefault();
            const file = $('#csvFile')[0].files[0];
            if (!file) return alert('Select a file');
            const reader = new FileReader();
            reader.onload = ev => processExcelData(ev.target.result);
            reader.readAsArrayBuffer(file);
        });

        /* --------------------------------------------------------------
           6. Send / Clear buttons (unchanged)
           -------------------------------------------------------------- */
        $('#sendToSheet').on('click', '.btn-send', function () {
            const officers = $('#officerTable').DataTable().data().toArray();
            if (!officers.length) return alert('No data');

            $('#loadingModalBody').text('Uploading...');
            loadingModal.show();

            setTimeout(() => {
                $('#loadingModalBody').text('Success!');
                setTimeout(() => loadingModal.hide(), 1500);
            }, 7000);

            $('#hiddenOfficers').val(JSON.stringify(officers));
            $('#hiddenCasesBySheet').val(JSON.stringify(casesBySheet));
            $('#hiddenForm').submit();
        });

        $('#sendToSheet').on('click', '.btn-clear', function () {
            localStorage.clear();
            casesBySheet = {};
            populateDataTable([]);
            $('#sendToSheet').hide();
            alert('Data cleared');
        });

        window.handleUploadResponse = (status, msg) => {
            if (status === 'error') {
                loadingModal.hide();
                alert('Upload error: ' + decodeURIComponent(msg));
            }
        };
    });
</script>
</body>
</html>
